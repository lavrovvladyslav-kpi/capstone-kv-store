name: Deploy Replicated KV Store to AWS EC2 (Milestone 3)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.COORDINATOR_PUBLIC_IP }} >> ~/.ssh/known_hosts

      - name: Copy updated files to Coordinator
        run: |
          scp kv_node.py benchmark_hashing.py benchmark_replication.py openapi.yaml \
            ec2-user@${{ secrets.COORDINATOR_PUBLIC_IP }}:~/

      - name: Rollout Replicated Cluster (2 Shards x 3 Replicas)
        run: |
          ssh ec2-user@${{ secrets.COORDINATOR_PUBLIC_IP }} << 'EOF'
            set -e
            echo "1. Updating code on private shard hosts..."
            scp -i ~/capstone-key.pem -o StrictHostKeyChecking=no ~/kv_node.py ec2-user@${{ secrets.SHARD1_PRIVATE_IP }}:~/
            scp -i ~/capstone-key.pem -o StrictHostKeyChecking=no ~/kv_node.py ec2-user@${{ secrets.SHARD2_PRIVATE_IP }}:~/

            echo "2. Restarting Coordinator on port 8000..."
            pkill -f '[k]v_node.py --role coordinator' || true
            sleep 1
            nohup python3 ~/kv_node.py --role coordinator --node-id coordinator-1 --port 8000 < /dev/null > ~/coordinator.log 2>&1 &
            sleep 2

            echo "3. Cleaning old shard processes and logs..."
            ssh -n -i ~/capstone-key.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.SHARD1_PRIVATE_IP }} "pkill -f '[k]v_node' || true; rm -f ~/wal_shard-1.jsonl ~/offset_shard-1*.json ~/state_shard-1*.json"
            ssh -n -i ~/capstone-key.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.SHARD2_PRIVATE_IP }} "pkill -f '[k]v_node' || true; rm -f ~/wal_shard-2.jsonl ~/offset_shard-2*.json ~/state_shard-2*.json"
            sleep 1

            echo "4. Starting Replica Set for shard-1 (1 Leader + 2 Followers)..."
            ssh -n -i ~/capstone-key.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.SHARD1_PRIVATE_IP }} "nohup python3 ~/kv_node.py --role shard --replica-role leader --shard-id shard-1 --node-id shard-1-leader --port 8001 --coordinator-url http://${{ secrets.COORDINATOR_PRIVATE_IP }}:8000 --advertise-url http://${{ secrets.SHARD1_PRIVATE_IP }}:8001 < /dev/null > ~/shard-1-leader.log 2>&1 & sleep 1; nohup python3 ~/kv_node.py --role shard --replica-role follower --shard-id shard-1 --node-id shard-1-follower-1 --port 8002 --leader-url http://${{ secrets.SHARD1_PRIVATE_IP }}:8001 --coordinator-url http://${{ secrets.COORDINATOR_PRIVATE_IP }}:8000 --advertise-url http://${{ secrets.SHARD1_PRIVATE_IP }}:8002 < /dev/null > ~/shard-1-follower-1.log 2>&1 & nohup python3 ~/kv_node.py --role shard --replica-role follower --shard-id shard-1 --node-id shard-1-follower-2 --port 8003 --leader-url http://${{ secrets.SHARD1_PRIVATE_IP }}:8001 --coordinator-url http://${{ secrets.COORDINATOR_PRIVATE_IP }}:8000 --advertise-url http://${{ secrets.SHARD1_PRIVATE_IP }}:8003 < /dev/null > ~/shard-1-follower-2.log 2>&1 &"

            echo "5. Starting Replica Set for shard-2 (1 Leader + 2 Followers)..."
            ssh -n -i ~/capstone-key.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.SHARD2_PRIVATE_IP }} "nohup python3 ~/kv_node.py --role shard --replica-role leader --shard-id shard-2 --node-id shard-2-leader --port 8001 --coordinator-url http://${{ secrets.COORDINATOR_PRIVATE_IP }}:8000 --advertise-url http://${{ secrets.SHARD2_PRIVATE_IP }}:8001 < /dev/null > ~/shard-2-leader.log 2>&1 & sleep 1; nohup python3 ~/kv_node.py --role shard --replica-role follower --shard-id shard-2 --node-id shard-2-follower-1 --port 8002 --leader-url http://${{ secrets.SHARD2_PRIVATE_IP }}:8001 --coordinator-url http://${{ secrets.COORDINATOR_PRIVATE_IP }}:8000 --advertise-url http://${{ secrets.SHARD2_PRIVATE_IP }}:8002 < /dev/null > ~/shard-2-follower-1.log 2>&1 & nohup python3 ~/kv_node.py --role shard --replica-role follower --shard-id shard-2 --node-id shard-2-follower-2 --port 8003 --leader-url http://${{ secrets.SHARD2_PRIVATE_IP }}:8001 --coordinator-url http://${{ secrets.COORDINATOR_PRIVATE_IP }}:8000 --advertise-url http://${{ secrets.SHARD2_PRIVATE_IP }}:8003 < /dev/null > ~/shard-2-follower-2.log 2>&1 &"

            sleep 4
            echo "6. Checking Coordinator health and registered Replica Sets..."
            curl -s http://localhost:8000/health
            echo ""
            curl -s http://localhost:8000/shards
          EOF